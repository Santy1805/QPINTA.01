<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href = "estilos.css">
  <title>Qpinta Menu</title>
  
</head>
<body>

<h2 class="sr-only">Menú interactivo Qpinta — elegí tu producto, personalizalo y enviá el pedido por WhatsApp</h2>
<div class="popup-overlay" id="promo-popup" onclick="closePopupEv(event)">
  <div class="popup-modal">
    <button class="popup-close-btn" onclick="closePopupForce()">×</button>
    <div class="popup-content" onclick="goToPromosFromPopup()">
      <img src="image/promo.jpg" alt="¡Promoción Imperdible!">
    </div>
  </div>
</div>
<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-img-container">
        <img src="image/logoso.png" alt="Logo Qpinta" class="logo-img">
      </div>
      <span class="logo-text">Qpinta</span>
    </div>
    <button class="cart-btn" onclick="openCart()">
      Carrito <span id="cart-count">0</span>
    </button>
  </div>


  <div class="cats" id="cats-bar">
    <button class="cat-btn active" onclick="filterCat('Todos',this)">Todos</button>
    <!-- Se añade id para poder referenciar este botón desde JavaScript -->
    <button id="btn-cat-promos" class="cat-btn" onclick="filterCat('Promos',this)">🎉 Promos</button>
    <button class="cat-btn" onclick="filterCat('Hamburguesas',this)">🍔 Hamburguesas</button>
    <button class="cat-btn" onclick="filterCat('Sandwiches',this)">🥖 Sandwiches</button>
    <button class="cat-btn" onclick="filterCat('Pizzas',this)">🍕 Pizzas</button>
    <button class="cat-btn" onclick="filterCat('Empanadas',this)">🥟 Empanadas</button>
    <button class="cat-btn" onclick="filterCat('extras',this)">Extras</button>
  </div>

  <p class="section-title" id="section-lbl">Menú Especial "Qpinta"</p>
  <div class="menu-grid" id="menu-grid"></div>
</div>

<div class="overlay" id="prod-overlay" onclick="closeProd(event)">
  <div class="modal" id="prod-modal">
    <div class="modal-header">
      <span class="modal-title" id="mod-title">Personalizar</span>
      <button class="close-btn" onclick="closeProdForce()">×</button>
    </div>
    <div id="mod-body"></div>
    <div class="modal-footer">
      <div class="subtotal">Total: <strong id="mod-total">$0.00</strong></div>
      <button class="confirm-btn" onclick="addToCart()">Agregar al pedido</button>
    </div>
  </div>
</div>

<div class="cart-overlay" id="cart-overlay" onclick="closeCartEv(event)">
  <div class="cart-modal">
    <div class="modal-header">
      <span class="modal-title">Tu Pedido</span>
      <button class="close-btn" onclick="closeCart()">×</button>
    </div>
    <div id="cart-body"></div>
  </div>
</div>
<!-- Footer con medios de pago y derechos de autor -->
<footer class="main-footer">
  <div class="footer-payments">
    <p class="payments-title">Medios de pago</p>
    <div class="payments-icons">
      <!-- Tarjeta de Débito / Crédito -->
      <div class="payment-badge" aria-label="Tarjeta de Débito o Crédito">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
        <span>Tarjetas</span>
      </div>
      <!-- Transferencia / Efectivo -->
      <div class="payment-badge" aria-label="Efectivo o Transferencia">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        <span>Efectivo / Transf.</span>
      </div>
    </div>
  </div>
  <div class="footer-copyright">
    <p>&copy; 2026 Qpinta. Todos los derechos reservados.</p>
    <p>Creado por SantLee </p>
  </div>
</footer>

<script src="funciones.js"></script>
</body>
</html>
